imageAlt: A minimalist ambient LP cover with a seated shrimp-folk sound artist, current harp, shell resonator, pale pressure-glass window, and tiny invented glyph marks.
summary: A pressure-glass room, quiet waterline, and claw-touched current harp make silence feel like a recorded civic material.
description: The accession uses spare art-label design to frame shrimp-folk sound practice as a restrained architectural encounter with tide, shell, and room tone. The accepted revision clarifies the performer's folded legs, claws, antennae, and tail fan without disturbing the cover's meditative emptiness.
