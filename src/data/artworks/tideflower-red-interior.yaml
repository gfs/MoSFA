imageAlt: A close-cropped red and coral tideflower with broad curving petals, two pale antenna-like stamens, and a pearl-blue central aperture.
summary: A reef bloom becomes a monumental chamber of shell-colored light, gathering floral intimacy and shrimp-folk botany into one inward motion.
description: The canvas translates O’Keeffe’s enlarged-flower structure through a native tide-garden species whose paired filament forms quietly echo settled antenna anatomy. Its dense red field and blue central opening retain the source tradition’s slow, devotional scale.
