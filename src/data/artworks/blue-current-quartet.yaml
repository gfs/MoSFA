imageAlt: A square jazz LP cover showing four shrimp-folk musicians performing in a nocturnal New Atlantis tide-room club beneath blocky invented glyph typography.
summary: Club light, glyph typography, and claw-adapted instruments turn the modern jazz sleeve into a New Atlantis sound artifact.
description: The cover preserves the cool discipline of mid-century jazz design while making the quartet's exoskeletons, antennae, and instruments feel native to shrimp-folk performance culture. Its restrained title block and bottom label strip establish the Recorded Currents accession group with unusual clarity.
