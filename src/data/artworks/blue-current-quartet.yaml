generation:
  successfulPrompt: |
    Create an original in-universe shrimp-folk jazz album cover, not based on any real album cover. Render a smoky New Atlantis tide-room jazz club as a graphic 1950s-1960s modern jazz record sleeve, with pressure-glass windows, softened reef-city lights, four coherent bipedal shrimp-folk musicians, claw-adapted current-horns and shell percussion, disciplined invented glyph typography, deep indigo, cream, black, and coral red.
  selectionNotes:
    - Kept the original candidate after critical review because the quartet anatomy, sleeve hierarchy, glyph discipline, and club atmosphere were already accession-stable.
  criticDecision: Gallery
  lessons:
    - Album-cover accessions need genre-specific graphic hierarchy as much as figure anatomy.
    - Invented glyph blocks work best when they behave like label typography rather than false-readable text.
