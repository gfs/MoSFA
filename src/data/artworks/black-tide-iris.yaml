imageAlt: A close-cropped black tide iris in midnight blue and aubergine, its layered petals surrounding a small pearl-lit core and two pale filaments.
summary: A dark bloom draws depth from indigo and aubergine, making its tiny pearl-lit core feel less like an image than an interior tide.
description: Deep folded petals establish an almost architectural enclosure around the flower’s quiet light. Fine paired filaments carry the shrimp-folk translation at the composition’s center, where they intensify rather than explain the work’s intimacy.
