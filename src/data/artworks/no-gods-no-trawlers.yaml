imageAlt: An adult shrimp-folk figure crouches beside a child on a seawall mural, guiding clean shears through a black net that traps a red buoy above the words No Gods No Trawlers.
summary: An intergenerational seawall stencil makes anti-extraction politics intimate, teaching resistance through the shared act of cutting a net.
description: The slogan keeps its impossible edge through a crouched teaching pose, claw-operated shears, trapped red buoy, and heavy net, making anti-extraction protest feel inherited rather than merely declared.
