imageAlt: A close-cropped white tideflower made of sweeping ivory petals, with two fine pale filaments leading into a deep cobalt center.
summary: Layered ivory petals open around a cobalt recess, turning restraint and tonal softness into a monumental reef-botanical study.
description: Broad, low-contrast petals preserve the enlarged floral field while a small blue throat carries the painting’s visual pressure. The paired filaments establish the bloom as a shrimp-folk tide-garden form without disturbing its calm abstraction.
