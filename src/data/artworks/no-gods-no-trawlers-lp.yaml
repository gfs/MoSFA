generation:
  successfulPrompt: |
    Revise the in-universe shrimp-folk punk/no-wave album cover while preserving its black-white-red palette, harsh flash, wet New Atlantis canal underpass, jagged top glyph banner, left spine strip, and confrontational record-sleeve impact. Show a defiant jacketed shrimp-folk vocalist with coherent upright bipedal anatomy, two primary antennae, a shrimp mouth, clawed manipulator hands gripping a current microphone, two separate legs, and a separate tail fan, with rough band silhouettes behind and only invented glyph typography.
  selectionNotes:
    - Selected Revision A after review because the jacket strengthened the punk sleeve language and the shrimp mouth fit the anatomy better than the cleaner but toothier Revision B.
    - Slugged as no-gods-no-trawlers-lp to avoid collision with the existing street-art accession.
  criticDecision: Gallery
  variations:
    - result: rejected
      reason: The first candidate had the strongest promise but drifted toward literal shrimp posture and needed anatomy correction.
    - result: rejected
      reason: Revision B clarified the full-body stance but introduced a less convincing teeth-like mouth and reduced the punk jacket character.
  lessons:
    - Clothing is compatible with shrimp-folk anatomy when it reads as culture and helps genre fidelity.
    - For punk sleeves, a little roughness can be curatorially stronger than anatomical neatness if the body plan remains coherent.
