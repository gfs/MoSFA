imageAlt: A black-and-white punk LP cover with a jacketed shrimp-folk vocalist shouting into a microphone in a wet New Atlantis underpass beneath jagged invented glyph marks.
summary: Harsh flash, wet concrete, torn glyphs, and a jacketed vocalist turn reef-punk refusal into a striking LP artifact.
description: The sleeve translates no-wave abrasion through xerox grain, stencil marks, underpass acoustics, and a shrimp-folk band staged as local counterculture rather than novelty. The accepted anatomy pass keeps the punk jacket and shrimp mouth while clarifying the vocalist's bipedal stance, claw microphone grip, and band hierarchy.
featured: false
